<!-- Banner Evento Prossimo - Caricato via JS -->
<div class="event-banner" id="eventBanner" style="display:none;">
    <div class="event-banner-content">
        <div class="event-banner-icon"><i class="fas fa-calendar-alt"></i></div>
        <div class="event-banner-info">
            <div class="event-banner-title" id="bannerTitle"></div>
            <div class="event-banner-meta">
                <span class="event-banner-date" id="bannerDate"></span>
            </div>
            <a href="#" class="event-banner-btn" id="bannerLink">Scopri di più <i class="fas fa-arrow-right"></i></a>
        </div>
        <button class="event-banner-close" id="bannerClose" aria-label="Chiudi banner"><i class="fas fa-times"></i></button>
    </div>
</div>
<script>
(function(){
    // Parsing data robusto (gestisce YYYY-MM-DD)
    function parseEventDate(dataStr, oraStr) {
        var parts = dataStr.split('-');
        var year = parseInt(parts[0], 10);
        var month = parseInt(parts[1], 10) - 1;
        var day = parseInt(parts[2], 10);
        var timeParts = (oraStr || '23:59').split(':');
        var hour = parseInt(timeParts[0], 10);
        var min = parseInt(timeParts[1], 10);
        return new Date(year, month, day, hour, min).getTime();
    }

    fetch('data/eventi.json')
        .then(function(r) { return r.json(); })
        .then(function(eventi) {
            if (!eventi || !eventi.length) return;

            var adesso = Date.now();
            var eventiFuturi = eventi.filter(function(e) {
                if (!e.data) return false;
                return parseEventDate(e.data, e.ora) >= adesso;
            }).sort(function(a, b) {
                return parseEventDate(a.data, a.ora) - parseEventDate(b.data, b.ora);
            });

            if (!eventiFuturi.length) return;

            var evento = eventiFuturi[0];
            var eventoTs = parseEventDate(evento.data, evento.ora);
            var banner = document.getElementById('eventBanner');

            // Controlla se già chiuso
            if (localStorage.getItem('banner_dismissed_' + evento.id)) return;

            // Formatta data
            var giorni = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
            var mesi = ['Gennaio', 'Febbraio', 'Marzo', 'Aprile', 'Maggio', 'Giugno', 'Luglio', 'Agosto', 'Settembre', 'Ottobre', 'Novembre', 'Dicembre'];
            var d = new Date(eventoTs);
            var dataStr = giorni[d.getDay()] + ' ' + d.getDate() + ' ' + mesi[d.getMonth()];
            if (evento.ora) dataStr += ' • ' + evento.ora;

            // Titolo troncato (max 20 caratteri)
            var titolo = evento.titolo;
            if (titolo.length > 20) {
                titolo = titolo.substring(0, 20) + '...';
            }

            // Popola banner
            document.getElementById('bannerTitle').textContent = titolo;
            document.getElementById('bannerDate').textContent = dataStr;
            document.getElementById('bannerLink').href = 'spettacoli-eventi?evento=' + evento.id;
            banner.setAttribute('data-evento-id', evento.id);
            banner.setAttribute('data-evento-ts', eventoTs);

            // Mostra banner
            banner.style.display = '';
            banner.classList.add('visible');
            document.body.classList.add('has-event-banner');

            function updateHeight() {
                var h = banner.offsetHeight;
                document.documentElement.style.setProperty('--banner-height', h + 'px');
            }
            requestAnimationFrame(function() {
                requestAnimationFrame(updateHeight);
            });
            window.addEventListener('resize', updateHeight);

            // Funzione per nascondere banner
            function dismissBanner() {
                localStorage.setItem('banner_dismissed_' + evento.id, '1');
                banner.classList.remove('visible');
                document.body.classList.remove('has-event-banner');
                document.documentElement.style.setProperty('--banner-height', '0px');
                banner.style.display = 'none';
            }

            // Chiusura con X
            document.getElementById('bannerClose').onclick = dismissBanner;

            // Chiusura con click su "Scopri di più"
            document.getElementById('bannerLink').onclick = dismissBanner;

            // Auto-rimuovi quando evento scade (controllo ogni minuto)
            var checkInterval = setInterval(function() {
                if (eventoTs < Date.now()) {
                    clearInterval(checkInterval);
                    banner.classList.remove('visible');
                    document.body.classList.remove('has-event-banner');
                    document.documentElement.style.setProperty('--banner-height', '0px');
                    banner.style.display = 'none';
                }
            }, 60000);
        })
        .catch(function() {});
})();
</script>
